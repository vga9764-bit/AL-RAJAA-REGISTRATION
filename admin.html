<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة نادي الرجاء</title>

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<header>

<img src="images/logo.png" class="logo">

<h1>لوحة إدارة نادي الرجاء الرياضي</h1>

<p>إدارة طلبات تسجيل اللاعبين</p>

</header>

<div class="cards">

<div class="card">
<h2 id="totalPlayers">0</h2>
<p>إجمالي الطلبات</p>
</div>

<div class="card">
<h2 id="pendingPlayers">0</h2>
<p>قيد المراجعة</p>
</div>

<div class="card">
<h2 id="acceptedPlayers">0</h2>
<p>المقبولين</p>
</div>

<div class="card">
<h2 id="rejectedPlayers">0</h2>
<p>المرفوضين</p>
</div>

</div>

<div class="tableBox">

<input
type="text"
id="search"
placeholder="ابحث عن لاعب...">

<table>

<thead>

<tr>

<th>رقم اللاعب</th>
<th>الاسم</th>
<th>المركز</th>
<th>الهاتف</th>
<th>الحالة</th>
<th>الإجراءات</th>

</tr>

</thead>

<tbody id="playersTable">

</tbody>

</table>

</div>

<script type="module" src="js/admin.js"></script>

</body>

</html>
