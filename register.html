<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استمارة تسجيل لاعب - نادي الرجاء الرياضي</title>

<link rel="stylesheet" href="css/style.css">

<style>
.container{
    max-width:850px;
    margin:40px auto;
    background:#1b1b1b;
    padding:30px;
    border-radius:15px;
    border:2px solid gold;
}

h2{
    text-align:center;
    color:gold;
    margin-bottom:25px;
}

form{
    display:grid;
    gap:15px;
}

label{
    color:gold;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:16px;
}

textarea{
    height:100px;
}

button{
    background:gold;
    color:black;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#ffcc00;
}
</style>

</head>

<body>

<header>

<img src="images/logo.png" class="logo">

<h1>نادي الرجاء الرياضي</h1>

<p>استمارة تسجيل لاعب</p>

</header>

<div class="container">

<h2>بيانات اللاعب</h2>

<form id="playerForm">

<label>الصورة الشخصية</label>
<input type="file" id="photo">

<label>الاسم الكامل</label>
<input type="text" id="name" required>

<label>تاريخ الولادة</label>
<input type="date" id="birth">

<label>رقم الهاتف</label>
<input type="tel" id="phone">

<label>العنوان</label>
<input type="text" id="address">

<label>المركز</label>

<select id="position">
<option>حارس مرمى</option>
<option>مدافع</option>
<option>وسط</option>
<option>مهاجم</option>
</select>

<label>الطول (سم)</label>
<input type="number" id="height">

<label>الوزن (كغم)</label>
<input type="number" id="weight">

<label>القدم المفضلة</label>

<select id="foot">
<option>اليمنى</option>
<option>اليسرى</option>
<option>كلتاهما</option>
</select>

<label>الأندية السابقة</label>
<textarea id="clubs"></textarea>

<label>ملاحظات</label>
<textarea id="notes"></textarea>

<button type="submit">
إرسال الطلب
</button>

</form>

</div>
<script type="module" src="js/register.js"></script>
</body>
</html>
